services:
  - type: web
    name: rag-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: openrouter
      - key: CHAT_MODEL
        value: openrouter/free
      - key: EMBEDDING_MODEL
        value: liquid/lfm-2.5-embedding-350m:free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
